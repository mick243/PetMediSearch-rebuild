# PetMediSearch 운영 구성 (API + MySQL).
#
# 화면(client)은 Vercel 에 올라가므로 여기 없습니다. 이 파일은 서버 한 대에
# API 와 DB 를 같이 띄우는 구성입니다.
#
# 처음 띄우기:
#   cp server/.env.example server/.env   # 값을 채운 뒤
#   docker compose --env-file server/.env up -d
#   docker compose --env-file server/.env run --rm -e DB_ROOT_PASSWORD='root-암호' api node dist/scripts/createDbUser.js
#   docker compose --env-file server/.env exec api node dist/scripts/importData.js   # 시설 데이터 적재
#   docker compose --env-file server/.env exec -e ADMIN_PASSWORD='고른-비밀번호' api node dist/scripts/createAdmin.js
#
# --env-file 을 빼면 안 됩니다. 아래의 ${DB_…} 는 server/.env 가 아니라 셸이나 루트 .env 에서
# 읽혀서, 빼면 "required variable … is missing" 으로 멈춥니다(docs/QA-2026-09-13.md).
#
# 관리형 DB(RDS·PlanetScale 등)를 쓴다면 db 서비스를 지우고 server/.env 의
# DB_HOST 만 그쪽으로 바꾸면 됩니다. api 서비스는 그대로 씁니다. 앱 계정은 그 DB 의
# 관리자 계정으로 createDbUser.ts 를 돌려 만듭니다(DB_ROOT_USER 에 그 이름).

services:
  db:
    image: mysql:8
    restart: unless-stopped
    # TZ 만으로는 부족합니다. 그건 컨테이너의 시스템 시간대라 로그에만 보이고,
    # MySQL 의 time_zone 은 SYSTEM 이면 이미지가 뜬 시점의 UTC 로 굳습니다.
    # 그 상태에서는 CURRENT_TIMESTAMP 가 UTC 벽시계로 들어가, 화면이 9시간 이른
    # 시각을 보여 줍니다. 세션 시간대를 직접 못박습니다.
    #
    # 'Asia/Seoul' 이 아니라 '+09:00' 인 이유: 이름 있는 시간대를 쓰려면 MySQL 의
    # 시간대 표를 미리 적재해야 하는데(mysql_tzinfo_to_sql) 공식 이미지는 하지
    # 않습니다. 그대로 주면 mysqld 가 뜨지 않습니다. 한국은 서머타임이 없어
    # 고정 오프셋으로 정확합니다.
    command:
      - --default-time-zone=+09:00
    environment:
      # root 는 스키마 변경·백업·계정 관리에만 씁니다. 앱은 아래의 앱 계정으로 붙습니다.
      # 예전에는 root 암호와 앱이 쓰는 암호가 같은 DB_PASSWORD 였고, 앱이 root 로 접속했습니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?server/.env 에 DB_ROOT_PASSWORD 를 넣으세요}
      MYSQL_DATABASE: ${DB_NAME:-petmedisearch}
      # 볼륨이 비어 있을 때 한 번, 위 DB 에만 권한이 있는 앱 계정을 만듭니다(root 는 쓸 수 없음).
      # 권한을 행 읽기·쓰기로 더 좁히는 것은 scripts/createDbUser.ts 입니다.
      MYSQL_USER: ${DB_USER:?server/.env 에 DB_USER 를 넣으세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?server/.env 에 DB_PASSWORD 를 넣으세요}
      TZ: Asia/Seoul
    volumes:
      # 데이터는 이름 있는 볼륨에 둡니다. 컨테이너를 지워도 남습니다.
      - db-data:/var/lib/mysql
      # 처음 뜰 때(볼륨이 비어 있을 때)만 실행됩니다. 이름 순서대로 도므로 접두사를 붙였습니다.
      - ./server/scripts/createFacilitiesTable.sql:/docker-entrypoint-initdb.d/01-facilities.sql:ro
      - ./server/scripts/createTables.sql:/docker-entrypoint-initdb.d/02-tables.sql:ro
    healthcheck:
      # 암호를 설정 파일에 풀어 넣지 않고 컨테이너 안의 값으로 붙습니다($$ 는 compose 가 아니라 셸이 읽습니다).
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # 바깥으로 열지 않습니다. api 만 같은 네트워크에서 닿으면 됩니다.
    # 바깥에서 접속해야 하면 아래를 127.0.0.1 에 묶어 여세요.
    # ports:
    #   - '127.0.0.1:3306:3306'

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      # 컨테이너에는 시간대가 없어 Node 가 UTC 로 돕니다. 로그 시각이 9시간
      # 어긋나고, 나중에 배치(접종 알림 등)를 붙이면 예약 시각도 UTC 로 잡힙니다.
      # DB 에 넣는 값은 server/db/prisma.ts 가 세션을 UTC 로 못박아 두어 이것과 무관합니다.
      TZ: Asia/Seoul
      # compose 안에서는 서비스 이름이 곧 호스트 이름입니다.
      DB_HOST: db
      DB_PORT: '3306'
      # root 암호는 DB 컨테이너만 씁니다. server/.env 에 같이 있어도 앱에는 넘기지 않아서,
      # 앱이 뚫려도 root 로 이어지지 않게 합니다. 계정을 만들 때만 exec -e 로 넘깁니다.
      DB_ROOT_PASSWORD: ''
      # TRUST_PROXY 는 여기서 정하지 않고 server/.env 에 둡니다. 앞에 프록시를 두느냐에 달린
      # 값이라서입니다(.env.example 설명). 예전에는 여기에 '1' 이 박혀 있어, 프록시 없이 포트를
      # 연 구성에서도 X-Forwarded-For 를 믿었습니다.
    depends_on:
      db:
        # DB 가 "떠 있는" 것이 아니라 "받을 준비가 된" 뒤에 시작합니다.
        condition: service_healthy
    ports:
      # 같은 서버의 nginx·Caddy 만 닿도록 127.0.0.1 에만 엽니다. 바깥에서 이 포트로 바로
      # 들어오는 길이 있으면 프록시를 거치지 않은 요청이 섞여 TRUST_PROXY 를 켤 수 없습니다.
      # 앞단이 다른 기계(클라우드 로드밸런서 등)라 바깥에 열어야 하면 '${PORT:-8081}:8081' 로 두고,
      # 방화벽에서 그 앞단 주소만 허용한 뒤 TRUST_PROXY 에 그 주소를 적으세요.
      - '127.0.0.1:${PORT:-8081}:8081'
    # 정상 종료(SIGTERM)를 처리하므로 넉넉히 기다려 줍니다.
    stop_grace_period: 15s

volumes:
  db-data:
