# 밀어 넣기 전에 자동으로 도는 검사.
#
# 이 프로젝트에는 지금까지 CI 가 없었습니다. 그래서 "부르는데 가져오지 않은
# 식별자" 나 타입 오류가 그대로 main 까지 갈 수 있었습니다.
#
# 오래 걸리는 것(도커 빌드·통합 테스트)은 넣지 않았습니다. 몇 분씩 걸리면
# 결과를 기다리지 않게 되고, 기다리지 않는 검사는 없는 것과 같습니다.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 같은 브랜치에 연달아 밀면 앞엣것은 취소합니다. 지난 커밋의 결과를 기다릴 이유가 없습니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 (린트 · 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Dockerfile 의 node:22-slim 과 맞춥니다. 버전이 어긋나면
          # CI 는 통과하는데 배포판에서만 깨지는 일이 생깁니다.
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ci 는 package-lock.json 그대로 설치합니다. install 과 달리 잠금 파일을 고치지 않아
      # CI 와 개발자 컴퓨터가 같은 버전을 씁니다.
      - run: npm ci
        working-directory: server

      # no-undef 가 "부르는데 require 하지 않은 식별자" 를 잡습니다.
      # 실제로 그 부류의 버그가 두 파일에 있었습니다.
      - run: npm run lint
        working-directory: server

      - run: npm test
        working-directory: server

  client:
    name: 화면 (타입 · 린트 · 테스트 · 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npx tsc -b
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm test
        working-directory: client

      # 빌드까지 해 봐야 합니다. 타입은 맞는데 번들이 안 되는 경우가 있습니다.
      - run: npm run build
        working-directory: client
        env:
          # 빌드 시점에 박히는 값들입니다. CI 에서는 통과 여부만 보면 되므로
          # 자리만 채웁니다. 실제 배포 값은 호스팅 쪽 환경변수로 넣습니다.
          VITE_BASE_URL: http://localhost:8081
