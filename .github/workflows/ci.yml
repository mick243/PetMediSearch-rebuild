# 밀어 넣기 전에 자동으로 도는 검사.
#
# 이 프로젝트에는 지금까지 CI 가 없었습니다. 그래서 "부르는데 가져오지 않은
# 식별자" 나 타입 오류가 그대로 main 까지 갈 수 있었습니다.
#
# 오래 걸리는 것(도커 빌드·통합 테스트)은 넣지 않았습니다. 몇 분씩 걸리면
# 결과를 기다리지 않게 되고, 기다리지 않는 검사는 없는 것과 같습니다.
#
# 예외는 응답 기준선(contract) 하나입니다. 서버를 TypeScript·Prisma 로 옮기는 동안
# 화면이 받는 응답이 그대로인지를 사람 눈 대신 이것이 봅니다. 따로 도는 작업이라
# 린트·단위 테스트 결과는 전처럼 먼저 나옵니다.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 같은 브랜치에 연달아 밀면 앞엣것은 취소합니다. 지난 커밋의 결과를 기다릴 이유가 없습니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 (린트 · 타입 · 테스트 · 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Dockerfile 의 node:22-slim 과 맞춥니다. 버전이 어긋나면
          # CI 는 통과하는데 배포판에서만 깨지는 일이 생깁니다.
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ci 는 package-lock.json 그대로 설치합니다. install 과 달리 잠금 파일을 고치지 않아
      # CI 와 개발자 컴퓨터가 같은 버전을 씁니다.
      - run: npm ci
        working-directory: server

      - run: npm run lint
        working-directory: server

      # "부르는데 가져오지 않은 식별자" 를 잡습니다. 실제로 그 부류의 버그가 두 파일에
      # 있었습니다(예전에는 ESLint 의 no-undef 가 하던 일).
      - run: npm run typecheck
        working-directory: server

      - run: npm test
        working-directory: server

      # 운영 이미지가 쓰는 dist/ 가 실제로 만들어지는지. 타입은 맞는데 빌드 설정이 틀린 경우를 잡습니다.
      - run: npm run build
        working-directory: server

  contract:
    name: 서버 (응답 기준선)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      # services: 로는 mysqld 에 옵션을 줄 수 없어 직접 띄웁니다. 운영 compose 와 같이
      # 시간대를 +09:00 으로 못박아야 NOW() 가 넣는 시각이 기준선과 맞습니다.
      # 태그는 운영의 mysql:8 이 지금 가리키는 판과 같게 고정합니다.
      - name: 테스트 DB 띄우기
        run: |
          docker run -d --name contract-db -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=contract mysql:8.4.11 --default-time-zone=+09:00
          # 초기화 중의 임시 서버는 TCP 를 받지 않습니다. TCP 로 붙어야 진짜 준비된 것입니다.
          for i in $(seq 1 60); do
            if docker exec contract-db mysql --protocol=TCP -h127.0.0.1 -uroot -pcontract -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs contract-db
          exit 1

      - run: npm run test:contract
        working-directory: server
        env:
          CONTRACT_DB_HOST: 127.0.0.1
          CONTRACT_DB_PORT: '3306'
          CONTRACT_DB_PASSWORD: contract

      # 마이그레이션 파일(prisma/migrations)을 빈 DB 에 처음부터 적용한 결과가 schema.prisma 와
      # 같은지. 스키마만 고치고 마이그레이션을 빼먹으면(또는 그 반대) 여기서 exit 2 로 멈춥니다.
      # 그림자 DB 는 같은 테스트 컨테이너의 별도 DB(prisma.config.ts 의 `<DB_NAME>_shadow`)인데,
      # Prisma 가 만들어 주지 않아 먼저 만듭니다.
      - name: 마이그레이션 ↔ 스키마 차이 0 인지
        run: |
          docker exec contract-db mysql --protocol=TCP -h127.0.0.1 -uroot -pcontract \
            -e 'CREATE DATABASE petmedisearch_ci_shadow'
          npm run migrate:diff
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: petmedisearch_ci
          DB_ROOT_PASSWORD: contract

  client:
    name: 화면 (타입 · 린트 · 테스트 · 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npx tsc -b
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm test
        working-directory: client

      # 빌드까지 해 봐야 합니다. 타입은 맞는데 번들이 안 되는 경우가 있습니다.
      - run: npm run build
        working-directory: client
        env:
          # 빌드 시점에 박히는 값들입니다. CI 에서는 통과 여부만 보면 되므로
          # 자리만 채웁니다. 실제 배포 값은 호스팅 쪽 환경변수로 넣습니다.
          VITE_BASE_URL: http://localhost:8081
